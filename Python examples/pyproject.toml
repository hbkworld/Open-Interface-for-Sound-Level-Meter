[project]
name = "python-examples"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.6"
dependencies = [
    "requests",
    "numpy",
    "websockets",
    "kaitaistruct",
    "matplotlib",
    "drawnow",
    "miniaudio",
    "python-dotenv",
    "pyqtgraph",
    "PyQt5",
    "PyQt5-Qt5<5.15.11",
    "packaging",
]

# Examples are run directly; no [project.scripts] entrypoint is defined.

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
